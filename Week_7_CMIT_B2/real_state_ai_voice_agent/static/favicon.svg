<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAF2FF"/>
    </linearGradient>
  </defs>

  <!-- rounded square background -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- subtle inner glow ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>

  <!-- voice waveform bars -->
  <g fill="url(#bar)">
    <rect x="24" y="42" width="7" height="16" rx="3.5"/>
    <rect x="36" y="32" width="7" height="36" rx="3.5"/>
    <rect x="48" y="22" width="7" height="56" rx="3.5"/>
    <rect x="60" y="32" width="7" height="36" rx="3.5"/>
    <rect x="72" y="42" width="7" height="16" rx="3.5"/>
  </g>
</svg>
