<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login | RealEstate Hub Executive AI</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">

  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: rgba(18, 26, 44, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent-emerald: #10b981;
      --accent-gold: #fbbf24;
      --accent-blue: #3b82f6;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(16, 185, 129, 0.15) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(251, 191, 36, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 60%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
    }

    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      backdrop-filter: blur(20px);
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(16, 185, 129, 0.1);
      position: relative;
      overflow: hidden;
    }

    .glass-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-emerald), var(--accent-gold), var(--accent-blue));
    }

    .brand-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(251, 191, 36, 0.15));
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 16px;
      color: var(--accent-emerald);
      font-size: 1.8rem;
      margin-bottom: 1rem;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, #34d399, #fbbf24);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.3rem;
    }

    .brand-subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i {
      position: absolute;
      left: 1rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .form-input {
      width: 100%;
      background: rgba(11, 15, 25, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.85rem 1rem 0.85rem 2.75rem;
      color: var(--text-main);
      font-size: 0.95rem;
      transition: all 0.2s ease;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--accent-emerald);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }

    .btn-login {
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
      margin-top: 1.5rem;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.45);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .alert {
      display: none;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      align-items: center;
      gap: 0.5rem;
    }

    .alert-danger {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }

    .credentials-hint {
      margin-top: 1.5rem;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px dashed rgba(255, 255, 255, 0.12);
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
    }

    .credentials-hint strong {
      color: var(--accent-gold);
    }

    .portal-link {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .portal-link a {
      color: var(--accent-emerald);
      text-decoration: none;
      font-weight: 500;
    }

    .portal-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="glass-card">
      <div class="brand-header">
        <div class="brand-icon">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1 class="brand-title">Executive Control</h1>
        <p class="brand-subtitle">UrduLish Voice Agent CRM & Analytics Dashboard</p>
      </div>

      <div id="alertBox" class="alert alert-danger">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="alertMessage">Invalid credentials</span>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="username" class="form-input" placeholder="admin" required autofocus autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" id="loginBtn" class="btn-login">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span id="btnText">Sign In to Dashboard</span>
        </button>
      </form>
<!-- 
      <div class="credentials-hint">
        <i class="fa-solid fa-circle-info" style="color: var(--accent-blue); margin-right: 4px;"></i>
        Demo Credentials: User <strong>admin</strong> | Pass <strong>admin123</strong>
      </div>
    </div> -->

    <div class="portal-link">
      Looking for customer portal? <a href="/website"><i class="fa-solid fa-arrow-right"></i> Visit Public Real Estate Website</a>
    </div>
  </div>

  <script>
    // If already authenticated, redirect straight to dashboard
    const existingToken = localStorage.getItem('admin_token');
    if (existingToken) {
      fetch('/api/v1/auth/verify', {
        headers: { 'Authorization': `Bearer ${existingToken}` }
      })
      .then(r => r.json())
      .then(data => {
        if (data.valid) {
          window.location.href = '/';
        }
      })
      .catch(() => {});
    }

    async function handleLogin(e) {
      e.preventDefault();
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const alertBox = document.getElementById('alertBox');
      const alertMsg = document.getElementById('alertMessage');
      const loginBtn = document.getElementById('loginBtn');
      const btnText = document.getElementById('btnText');

      alertBox.style.display = 'none';
      loginBtn.disabled = true;
      btnText.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

      try {
        const response = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: usernameInput.value.trim(),
            password: passwordInput.value.trim()
          })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          localStorage.setItem('admin_token', result.token);
          localStorage.setItem('admin_user', JSON.stringify(result.user));
          
          alertBox.className = 'alert alert-success';
          alertBox.innerHTML = '<i class="fa-solid fa-circle-check"></i> Authentication successful! Redirecting...';
          alertBox.style.display = 'flex';

          setTimeout(() => {
            window.location.href = '/';
          }, 600);
        } else {
          alertBox.className = 'alert alert-danger';
          alertBox.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> ${result.detail || 'Invalid username or password'}`;
          alertBox.style.display = 'flex';
          loginBtn.disabled = false;
          btnText.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard';
        }
      } catch (err) {
        alertBox.className = 'alert alert-danger';
        alertBox.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Server connection failed. Please ensure the server is running.';
        alertBox.style.display = 'flex';
        loginBtn.disabled = false;
        btnText.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard';
      }
    }
  </script>
</body>
</html>
