services:
  - type: web
    name: ilm-academy-ai-tutor
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api_server.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
