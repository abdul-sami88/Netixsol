name: Zarya Digital Bank CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify Guardrails, RAG, and Ticketing Engine
      run: |
        python src/run_day4_local_demo.py

    - name: Run CI API Health Check
      run: |
        python -c "from src.app import app; from fastapi.testclient import TestClient; client = TestClient(app); res = client.get('/api/health'); assert res.status_code == 200; print('CI Health Check: PASSED')"
