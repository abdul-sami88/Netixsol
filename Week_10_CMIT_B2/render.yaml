services:
  - type: web
    name: zarya-digital-bank-ai
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_GUARDRAILS
        value: "true"
      - key: MASK_PII_LOGS
        value: "true"
      - key: GROQ_API_KEY
        sync: false

