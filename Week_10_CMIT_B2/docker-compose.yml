version: '3.8'

services:
  zarya-ai-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zarya_digital_bank_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - DB_PATH=/app/data/zarya_banking.db
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - zarya-network

networks:
  zarya-network:
    driver: bridge
