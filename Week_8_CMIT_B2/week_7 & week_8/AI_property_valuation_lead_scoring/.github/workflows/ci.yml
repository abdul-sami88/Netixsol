name: Pakistan Real Estate AI CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Model Artifact Integrity
        run: |
          python -c "import os; assert os.path.exists('saved_models/valuation_champion_model.joblib'); assert os.path.exists('saved_models/leads_champion_model.joblib'); print('Model artifacts verified!')"

      - name: Run Test Suite
        run: |
          pytest test_serving_api.py test_day5_capstone.py -v
