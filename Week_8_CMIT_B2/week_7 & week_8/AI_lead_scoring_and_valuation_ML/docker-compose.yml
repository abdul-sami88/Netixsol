version: "3.8"

services:
  # -------------------------------------------------------------
  # 1. FastAPI Model Serving Backend
  # -------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: estate_ai_fastapi
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENV=production
      - DATABASE_URL=sqlite:////app/production_audit.db
      - DRIFT_ALERT_MAPE_THRESHOLD=15.0
      - DRIFT_ALERT_PSI_THRESHOLD=0.25
    volumes:
      - ./saved_models:/app/saved_models
      - ./reports:/app/reports
      - ./data_cleaned:/app/data_cleaned
      - db_data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # -------------------------------------------------------------
  # 2. Streamlit Interactive Dashboard & MLOps Control Tower
  # -------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: estate_ai_dashboard
    command: ["streamlit", "run", "dashboard.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      - ./saved_models:/app/saved_models
      - ./reports:/app/reports
      - ./data_cleaned:/app/data_cleaned
      - db_data:/app
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
