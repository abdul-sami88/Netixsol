name: Production CI/CD Pipeline - Real Estate AI Voice Agent

on:
  push:
    branches: [ main, master, release/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Code Quality & Evaluation Suite
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Code Linting
        run: |
          # Stop build if syntax errors or undefined names exist
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Task 1, 2 & 3 Production Evaluation Suite
        run: |
          python production_eval_and_deployment/eval_suite/prompt_injection_security.py
          python production_eval_and_deployment/eval_suite/performance_evaluator.py

  docker-build:
    name: Production Docker Container Build & Scan
    needs: lint-and-test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: production_eval_and_deployment/deployment/Dockerfile
          push: false
          tags: real-estate-voice-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
